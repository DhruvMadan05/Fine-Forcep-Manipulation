# dVRK PSM kinematic specification used by the pure-math reachability
# analysis (scripts/reachability/). Nothing here comes from the simulator.
#
# Source: jhu-dvrk/sawIntuitiveResearchKit (main branch)
#   arm:  share/kinematic/PSM.json                       (yaw, pitch, insertion)
#   tool: share/tool/LARGE_NEEDLE_DRIVER_400006.json      (roll, wrist pitch, wrist yaw)
#
# Base frame = the RCM frame: origin at the remote centre of motion, z up,
# tool shaft pointing along -z at q = 0.
#
# Joint order q = (yaw, pitch, insertion, roll, wrist_pitch, jaw). The jaws
# are modelled closed, so "jaw" is the tool's wrist-yaw DOF.
#
# Modified (Craig) DH, per joint:  T = Rx(alpha) Tx(a) Rz(theta + q) Tz(d)
# for revolute joints, and Rz(theta) Tz(d + q) for the prismatic insertion.
# (dVRK lists the constant theta / insertion d terms as "offset".)
dh:
  - {joint: yaw,         type: revolute,  alpha:  1.5708, a: 0.0,    theta:  1.5708, d:  0.0}
  - {joint: pitch,       type: revolute,  alpha: -1.5708, a: 0.0,    theta: -1.5708, d:  0.0}
  - {joint: insertion,   type: prismatic, alpha:  1.5708, a: 0.0,    theta:  0.0,    d: -0.4318}
  - {joint: roll,        type: revolute,  alpha:  0.0,    a: 0.0,    theta:  0.0,    d:  0.4162}
  - {joint: wrist_pitch, type: revolute,  alpha: -1.5708, a: 0.0,    theta: -1.5708, d:  0.0}
  - {joint: jaw,         type: revolute,  alpha: -1.5708, a: 0.0091, theta: -1.5708, d:  0.0}

# Jaw tip: this far along the last frame's +y axis (the jaw pointing axis;
# dVRK's tooltip_offset rotation maps the ISI tool z-axis onto it). dVRK
# reports the tool tip at the jaw pivot (no translation); 10.2 mm is the
# Large Needle Driver jaw length, used here because the jaw TIP must reach
# the hole/corner.
jaw_length: 0.0102

# Joint limits (rad; m for insertion), from the dVRK files above:
#   yaw +-91 deg, pitch +-53 deg, insertion 0-240 mm,
#   roll +-260 deg, wrist pitch +-80 deg, wrist yaw +-80 deg.
# For reference, the AMBF PSM model's ADF uses yaw +-1.60, pitch -0.61..0.77,
# roll +-3.05, wrist/jaw +-1.57 - the sim test will need to account for the
# tighter AMBF pitch range.
limits:
  yaw:         [-1.588, 1.588]
  pitch:       [-0.925025, 0.925025]
  insertion:   [0.0, 0.24]
  roll:        [-4.53786, 4.53786]
  wrist_pitch: [-1.39626, 1.39626]
  jaw:         [-1.39626, 1.39626]
